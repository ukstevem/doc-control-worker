services:
  pdf_worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: doc_pdf_worker
    restart: unless-stopped

    environment:
      DOC_NAS_ROOT: /data/input
      PREVIEW_ROOT: /data/state/previews

      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}

    volumes:
      - /mnt/doc_nas:/data/input:ro
      - worker_state:/data/state

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  worker_state: